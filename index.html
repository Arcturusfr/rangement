  <script>
    /* Diagnostic de démarrage : affiche à l'écran les fichiers introuvables et les erreurs JS.
       Volontairement en ligne : il doit fonctionner même si un fichier .js est absent. */
    (function () {
      var messages = [];
      function render() {
        var box = document.getElementById('boot-errors');
        if (!box || !messages.length) { return; }
        box.textContent = '';
        var title = document.createElement('p');
        title.textContent = 'L\u2019application n\u2019a pas pu démarrer correctement :';
        box.appendChild(title);
        messages.forEach(function (m) {
          var p = document.createElement('p');
          p.textContent = '\u2022 ' + m;
          box.appendChild(p);
        });
        box.hidden = false;
      }
      function add(message) {
        if (messages.indexOf(message) === -1) { messages.push(message); }
        render();
      }
      window.__rangementBoot = { add: add };
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT') {
          add('Fichier introuvable ou illisible : ' + t.getAttribute('src'));
        } else if (t && t.tagName === 'LINK') {
          add('Feuille de style introuvable : ' + t.getAttribute('href'));
        } else {
          var file = (e.filename || '').split('/').slice(-2).join('/');
          add('Erreur : ' + e.message + (file ? ' (' + file + ', ligne ' + e.lineno + ')' : ''));
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        add('Erreur : ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
      document.addEventListener('DOMContentLoaded', render);
    })();
  </script>
